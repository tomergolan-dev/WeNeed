# A backup for WeNeed's automatic task reminders, which are scheduled in
# Vercel Queues when a task is saved (see src/lib/task-emails.ts): asks the
# app to send any reminder that is due now. GitHub runs it far less often
# than every 10 minutes, and late; the app allows for that.
name: Task reminders

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send due reminders
        run: >
          curl --fail-with-body --silent --show-error --max-time 60
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          https://weneed.tomergolan.dev/api/cron/reminders
