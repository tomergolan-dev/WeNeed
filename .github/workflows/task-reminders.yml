# Sends WeNeed's automatic task reminders: calls the app every 10 minutes,
# and the app emails whatever reminders are due (see src/lib/task-emails.ts).
# GitHub may start a scheduled run a few minutes late; the reminders allow for it.
name: Task reminders

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send due reminders
        run: >
          curl --fail-with-body --silent --show-error --max-time 60
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          https://weneed.tomergolan.dev/api/cron/reminders
